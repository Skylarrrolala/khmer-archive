<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Photograph placeholder">
  <!--
    Stands in for an entry photograph that has not been taken yet.

    Deliberately wordless. This renders at card size on the browse page, where
    a visitor should read it as "a photo belongs here" — an earlier version of
    this file had "SAMPLE PHOTO / replace with a real photo" set in it, which
    put a developer note on the public page.

    Colours are the palette from app/globals.css: paper, accent-soft, accent,
    gold.
  -->
  <defs>
    <!-- A woven lattice, at the low opacity of a watermark. -->
    <pattern id="weave" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 24h48M24 0v48" stroke="#9a4a26" stroke-width="1.5" opacity="0.10"/>
    </pattern>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8ece1"/>
      <stop offset="100%" stop-color="#f1e0d0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#ground)"/>
  <rect width="800" height="600" fill="url(#weave)"/>

  <!-- A serving: a domed mound of dessert in a shallow bowl. -->
  <g fill="none" stroke="#9a4a26" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
    <path d="M336 300 Q400 236 464 300"/>
    <path d="M316 300 H484"/>
    <path d="M330 300 Q400 376 470 300"/>
  </g>
  <path d="M336 300 Q400 236 464 300 Z" fill="#c9922e" opacity="0.20"/>
</svg>
